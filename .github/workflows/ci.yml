name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (eslint ${{ matrix.eslint }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The dev toolchain is on ESLint 10, so these are its supported Node
        # versions -- not the wider range the package publishes in `engines`.
        node: ['20.19', '22.13', '24']
        eslint: ['9', '10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:eslint${{ matrix.eslint }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # eslint, the types check, and the generated-docs freshness check.
      - run: npm run lint

  package:
    name: verify published package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Catches a rule that works in-repo but breaks once packed and installed
      # under the published name, on both supported majors.
      - run: node scripts/verify-package.mjs
