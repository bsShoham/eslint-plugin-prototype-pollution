name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (eslint ${{ matrix.eslint }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ESLint 10's supported Node versions, not the wider `engines` range.
        node: ['20.19', '22.13', '24']
        eslint: ['9', '10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:eslint${{ matrix.eslint }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  package:
    name: verify published package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-package.mjs
